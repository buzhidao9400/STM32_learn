# ============================================================
# OpenOCD 配置文件
# 被 launch.json 通过 "configFiles": ["${workspaceFolder}/openocd.cfg"] 加载
#
# 【重要】下面两行是「调试探针(interface)」和「目标芯片(target)」，
#        必须和你的实际硬件一致，否则 OpenOCD 会在启动后立刻退出。
#        按你的板子取消注释对应组合，其余保持注释。
# ============================================================

# ---------- 组合 1：ST-Link + STM32F1xx（最常见的蓝丸/最小系统板）----------
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]

# ---------- 组合 2：ST-Link + STM32F4xx ----------
# source [find interface/stlink.cfg]
# source [find target/stm32f4x.cfg]

# ---------- 组合 3：CMSIS-DAP / DAPLink + STM32F1xx ----------
# source [find interface/cmsis-dap.cfg]
# source [find target/stm32f1x.cfg]

# ---------- 组合 4：J-Link + STM32F4xx ----------
# source [find interface/jlink.cfg]
# transport select swd
# source [find target/stm32f4x.cfg]

# ---------- 组合 5：沁恒 CH32V / 其他 RISC-V ----------
# source [find interface/wlink.cfg]
# source [find target/ch32v307.cfg]

# 适配速度（kHz）。连接不稳时可调低，例如 1000
adapter speed 2000

# 查看本机 OpenOCD 到底支持哪些探针/芯片：
#   ls /c/Users/19480/scoop/apps/openocd/current/share/openocd/scripts/interface
#   ls /c/Users/19480/scoop/apps/openocd/current/share/openocd/scripts/target
